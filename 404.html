<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — RenovaMais</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&family=Montserrat:wght@400;500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0D0D0D;color:#fff;font-family:'Montserrat',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;min-height:100vh;position:relative;overflow:hidden;text-align:center}

body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(168,255,0,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(168,255,0,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}

.logo{position:fixed;top:24px;left:24px;font-family:'Exo 2',sans-serif;font-weight:900;font-size:1.4rem;color:#fff;text-decoration:none;z-index:10}
.logo span{color:#A8FF00}

.num{font-family:'Exo 2',sans-serif;font-size:clamp(7rem,25vw,14rem);font-weight:900;line-height:1;color:#111;position:relative;user-select:none;animation:fadeIn .5s ease both}
.num::after{content:'404';position:absolute;inset:0;color:transparent;-webkit-text-stroke:2px #A8FF00;opacity:.25;pointer-events:none}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

h1{font-family:'Exo 2',sans-serif;font-size:clamp(1.4rem,3.5vw,2.2rem);font-weight:700;margin:8px 0 16px;animation:fadeUp .5s .2s both}
h1 span{color:#A8FF00}

p{font-family:'Poppins',sans-serif;font-size:.9rem;color:rgba(255,255,255,.5);max-width:400px;line-height:1.7;margin-bottom:36px;animation:fadeUp .5s .3s both}

.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fadeUp .5s .4s both}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:#A8FF00;color:#0D0D0D;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.85rem;padding:13px 28px;border-radius:4px;text-decoration:none;letter-spacing:.05em;text-transform:uppercase;transition:transform .2s,box-shadow .2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(168,255,0,.3)}
.btn-outline{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-family:'Montserrat',sans-serif;font-weight:600;font-size:.85rem;padding:13px 24px;border-radius:4px;text-decoration:none;transition:all .2s}
.btn-outline:hover{border-color:rgba(255,255,255,.3);color:#fff}

.links{display:flex;gap:24px;margin-top:48px;flex-wrap:wrap;justify-content:center;animation:fadeUp .5s .5s both}
.links a{font-family:'Poppins',sans-serif;font-size:.8rem;color:rgba(255,255,255,.3);text-decoration:none;transition:color .2s}
.links a:hover{color:#A8FF00}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<a href="/" class="logo">Renova<span>Mais</span></a>

<div class="num">404</div>
<h1>Página <span>não encontrada</span></h1>
<p>A página que procura não existe ou foi movida. Comece pelo início e encontre tudo o que precisa.</p>

<div class="btns">
  <a href="/" class="btn-primary">← Voltar ao início</a>
  <a href="/#contacto" class="btn-outline">Contactar-nos</a>
</div>

<div class="links">
  <a href="/#sobre">Sobre Nós</a>
  <a href="/#servicos">Serviços</a>
  <a href="/#portfolio">Portfolio</a>
  <a href="/#faq">FAQ</a>
</div>

</body>
</html>
