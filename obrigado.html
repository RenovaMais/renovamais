  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0D0D0D;
      color: #FFFFFF;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #A8FF00;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .icon svg { width: 40px; height: 40px; }
    h1 {
      font-family: 'Exo 2', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      margin-bottom: 1rem;
      animation: fadeUp 0.5s 0.2s both;
    }
    h1 span { color: #A8FF00; }
    p {
      font-size: 1.1rem;
      color: #AAAAAA;
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.5s 0.35s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .btn {
      display: inline-block;
      background: #A8FF00;
      color: #0D0D0D;
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.5s 0.5s both;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(168,255,0,0.3); }
    .whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      color: #25D366;
      text-decoration: none;
      font-size: 0.95rem;
      animation: fadeUp 0.5s 0.65s both;
    }
    .whatsapp:hover { text-decoration: underline; }
    .logo {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      font-family: 'Exo 2', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: #FFFFFF;
      text-decoration: none;
